# NAFLD / MASLD 相关阳性对照（非他汀主族；库外仅用于相似标定，不可写入提名）
# 来源口径：NAFLDkb curated 试验药 / 已报道降脂相关分子（公开结构）
version: 1
source: data/reference/nafldkb.csv
notes: >
  扩展 GoldSet 阳性以减轻「只会推他汀/贝特」先验；主排名证据仍冻结为
  chembl_lipid_v1 + pubchem_tox_v1。本文件由 load_goldset 合并进 positives。
cases:
  - name: Pioglitazone
    role: positive
    pathway: PPAR_gamma
    smiles: "CCc1ccc(CCOc2ccc(C[C@H]3SC(=O)NC3=O)cc2)nc1"
    expected:
      pass_filter: true
      high_lipid: true

  - name: Obeticholic Acid
    role: positive
    pathway: FXR
    smiles: "CC[C@H]1[C@@H](O)[C@@H]2[C@H](CC[C@]3(C)[C@@H]([C@H](C)CCC(=O)O)CC[C@@H]23)[C@@]2(C)CC[C@@H](O)C[C@@H]12"
    expected:
      pass_filter: true
      high_lipid: true

  - name: Elafibranor
    role: positive
    pathway: PPAR_alpha_delta
    smiles: "CSc1ccc(C(=O)/C=C/c2cc(C)c(OC(C)(C)C(=O)O)c(C)c2)cc1"
    expected:
      pass_filter: true
      high_lipid: true

  - name: Saroglitazar
    role: positive
    pathway: PPAR_alpha_gamma
    smiles: "CCO[C@@H](Cc1ccc(OCCn2c(C)ccc2-c2ccc(SC)cc2)cc1)C(=O)O"
    expected:
      pass_filter: true
      high_lipid: true

  - name: Resmetirom
    role: positive
    pathway: THR_beta
    smiles: "CC(C)c1cc(Oc2c(Cl)cc(-n3nc(C#N)c(=O)[nH]c3=O)cc2Cl)n[nH]c1=O"
    expected:
      pass_filter: true
      high_lipid: true

  - name: Metformin
    role: positive
    pathway: AMPK
    smiles: "CN(C)C(=N)NC(=N)N"
    expected:
      pass_filter: true
      high_lipid: true

  - name: Berberine
    role: positive
    pathway: AMPK_lipid
    smiles: "COc1ccc2cc3[n+](cc2c1OC)CCc1cc2c(cc1-3)OCO2"
    expected:
      pass_filter: true
      high_lipid: true

  - name: Ursodeoxycholic acid
    role: positive
    pathway: bile_acid
    smiles: "C[C@H](CCC(=O)O)[C@H]1CC[C@H]2[C@@H]3[C@@H](O)C[C@@H]4C[C@H](O)CC[C@]4(C)[C@H]3CC[C@]12C"
    expected:
      pass_filter: true
      high_lipid: true

  - name: Lanifibranor
    role: positive
    pathway: PPAR_pan
    smiles: "O=C(O)CCCc1cc2cc(Cl)ccc2n1S(=O)(=O)c1ccc2ncsc2c1"
    expected:
      pass_filter: true
      high_lipid: true
