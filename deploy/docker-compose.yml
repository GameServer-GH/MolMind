# MolMind 本地 Compose（无 nginx，直连 uvicorn）
# 在仓库根目录执行：
#   docker compose -f deploy/docker-compose.yml up --build
#   docker compose -f deploy/docker-compose.yml run --rm cli
#
# 浏览器：http://127.0.0.1:18765/
# 服务器部署见仓库外的 deploy_pro/（不入库）
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: molmind:0.2.1
    ports:
      - "18765:18765"
    environment:
      MOLMIND_MODE: auto
      PYTHONPATH: /app
    volumes:
      - ../output:/app/output
    command: ["uvicorn", "apps.api.app:app", "--host", "0.0.0.0", "--port", "18765"]

  cli:
    image: molmind:0.2.1
    profiles: ["cli"]
    environment:
      MOLMIND_MODE: offline
      PYTHONPATH: /app
    volumes:
      - ../output:/app/output
    command: ["python", "-m", "apps.cli.main", "--input", "data/sample.sdf", "--output", "output/nomination_top10.csv", "--mode", "offline"]
