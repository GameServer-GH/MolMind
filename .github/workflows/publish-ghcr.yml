# 在 GitHub 云端构建并推送 ghcr.io，避免本机 3GB 大层上传失败。
# 触发：Actions → Publish MolMind image to GHCR → Run workflow
name: Publish MolMind image to GHCR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag (e.g. 0.2.0)
        required: true
        default: "0.2.0"
      push_latest:
        description: Also tag as latest
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gameserver-gh/molmind:${{ inputs.version }}
            ghcr.io/gameserver-gh/molmind:${{ inputs.version }}-amd64
            ${{ inputs.push_latest && format('ghcr.io/gameserver-gh/molmind:latest') || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
