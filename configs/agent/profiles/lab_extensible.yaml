profile_id: lab_extensible
display_name: 实验室可扩展 · Catalog 主动添加
plugins:
  molmind-core:
    enabled: true
    builtin: true
skills:
  masld_nominate: { enabled: true }
  masld_mechanism: { enabled: true }
  masld_explain: { enabled: true }
  masld_export_bundle: { enabled: true }
policy:
  catalog_opt_in_only: true
  claim_ceiling: proxy_priority_only
  # 不预置启用任何 Catalog 项；仅允许用户主动添加
budgets:
  max_iterations: 5
  max_steps: 16
  max_tool_calls: 12
  max_retries_per_tool: 1
  # Covers one cold score_and_rank plus mechanism/Catalog finalization.
  max_wall_time_sec: 2200
  max_observation_chars: 16000
  max_no_progress_rounds: 2
