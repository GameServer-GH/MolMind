plugin_id: molmind-core
title: MolMind Core · MASLD 低毒降脂筛选核
builtin: true
enabled: true
catalog: false
description: 内置科学核。解析 SDF、硬过滤、降脂/毒性打分、排序多样性、导出与机制报告。唯一写榜入口 score_and_rank。
limits:
  top_n_min: 1
  top_n_max: 50
tool_limits:
  score_and_rank:
    top_n_min: 1
    top_n_max: 50
  export_nomination:
    top_n_min: 1
    top_n_max: 50
  query_evidence:
    writes_selection: false
    allow_live_default: false
    force_refresh_requires_live: true
tool_contracts:
  parse_sdf:
    requires: [sdf]
    produces: [molecule_index]
    idempotent: true
    input_schema:
      type: object
      properties: {}
  score_and_rank:
    requires: [sdf]
    produces: [frozen_result]
    # TargetMol cold-start runs may build local model/snapshot state and take
    # about 20 minutes; warm runs usually finish in under one minute.
    timeout_sec: 1800
    input_schema:
      type: object
      required: [top_n]
      properties:
        top_n: { type: integer, minimum: 1, maximum: 50 }
  export_nomination:
    requires: [frozen_result]
    produces: [candidate_csv]
    idempotent: true
    input_schema:
      type: object
      properties:
        tier: { type: string, enum: [primary, reserve] }
  query_evidence:
    # Direct identity queries are valid without a frozen ranking. When no
    # identity is supplied, the canonical tool returns audit_missing instead
    # of Governance fabricating an empty/negative result.
    requires: []
    produces: [evidence_card]
    idempotent: true
    timeout_sec: 45
    input_schema:
      type: object
      properties:
        molecule_id: { type: string }
        providers: { type: array }
  start_mechanism_report:
    requires: [frozen_result]
    # The runtime adapter starts the background job and waits for the PDF, so
    # its terminal success means the artifact is actually ready.
    produces: [mechanism_pdf]
    timeout_sec: 240
    input_schema: { type: object, properties: {} }
  get_mechanism_job:
    requires: [mechanism_job]
    produces: [mechanism_pdf]
    idempotent: true
    input_schema: { type: object, properties: {} }
  get_run_audit:
    requires: [frozen_result]
    produces: [run_audit]
    idempotent: true
    input_schema: { type: object, properties: {} }
  build_evidence_card:
    requires: [frozen_result]
    produces: [evidence_card]
    idempotent: true
    input_schema:
      type: object
      properties:
        molecule_id: { type: string }
  export_submission_bundle:
    requires: [frozen_result]
    produces: [results_bundle]
    idempotent: true
    input_schema: { type: object, properties: {} }
  apply_review:
    requires: [frozen_result]
    produces: [revised_result]
    confirmation_required: true
    input_schema:
      type: object
      required: [review_id]
      properties:
        review_id: { type: string }
tools:
  - parse_sdf
  - score_and_rank
  - export_nomination
  # Read-only local-first enrichment. Network access must be explicit.
  - query_evidence
  - start_mechanism_report
  - get_mechanism_job
  - get_run_audit
  - build_evidence_card
  - export_submission_bundle
  - draft_nomination_review
  - apply_review
  - eval_goldset
skills:
  - masld_nominate
  - masld_mechanism
  - masld_explain
  - masld_export_bundle
  - masld_full_submission
