# Compatibility for delivered repos:
# - applies_to_input_sha256 binds ID-scoped footnotes/seat changes to the
#   reviewed reference SDF. Other SDFs skip this bundle automatically.
# - Chemistry-level hard gates live in clinical_exclusions.yaml and always apply.

