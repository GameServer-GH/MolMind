# MolMind 正式版默认排序与融合权重（纳入 config_hash）
#
# 主路径冻结口径（Quality-Max 默认）：
#   主证据 = chembl_lipid_v1 + pubchem_tox_v1 + epa_ctx_tox_v1（仅已烘焙 snapshot）
#   nafldkb_v1 / dili_table_v1 默认不进主排名（enabled: false, ranking_weight: 0）
#   避免弱 S_lipid + 高 conf_e 刷榜
#
# mode_default: Quality-Max（唯一主路径）；evidence.allow_live 只授权显式
# query_evidence / bake enrichment，同一 screen Run 永远只消费冻结/本地证据。
mode_default: auto
seed: 42
top_n: 10
top_k_for_critic: 30
reserve_n: 20

# 更重相对排序；单候选关注效果×新颖性，Top10 等权求和。
# 具体归一化仍未确认，故冻结为透明 percentile 代理并同时导出等权平均敏感性视图。
competition_scoring:
  enabled: true
  normalization: percentile_rank
  primary: product
  sensitivity_view: equal_mean
  pool: eligible_run_candidates

weights:
  lipid: 0.40
  tox_safety: 0.40
  novelty: 0.10
  evidence_confidence: 0.10

gates:
  tox_hard: 0.65
  tox_soft: 0.45
  tox_nomination_max: 0.45  # 0.45–0.65 仅人工复核，不自动进入 Top 10
  lipid_min: 0.35
  # 计算提名允许进入 proxy_only 分层；真正的安全清除证据另行输出。
  # 这样不会把“没有查到风险”伪装成低毒，但也不会因缺少实验数据而静默丢失全部候选。
  min_toxicity_confidence: 0.0
  min_safety_evidence_coverage: 0.0
  local_toxicity_proxy_coverage: 0.20
  tox_uncertainty_penalty: 0.10
  # 仅有最低等级本地代理覆盖时，用保守上界做自动提名门控；非官方阈值。
  low_confidence_tox_margin: 0.05
  viability_proxy: 0.80  # 未明显损伤参考阈值；无湿实验值时不参与 SI（ADR-M16）

lipid_fuse:
  rule: 0.35
  positive_similarity: 0.30
  evidence: 0.25
  # lipid ML 未接线（P0-A1）：权重为 0，避免「配置有通道、分数恒 0」的虚假能力面
  ml: 0.0

tox_fuse:
  aggregation: max_head_with_weighted_context
  alert: 0.25
  dili: 0.30
  admet: 0.20
  physchem: 0.15
  evidence: 0.10

evidence:
  enabled: true
  use_snapshot: true
  allow_live: false              # enrichment 授权；不允许当前 screen 的 HTTP 响应参与排序
  # 生效 adapters 列表（仅列出参与主排名的通道）
  adapters:
    - chembl_lipid_v1
    - pubchem_tox_v1
    - epa_ctx_tox_v1
  # 全量通道开关；未列入 adapters 或 enabled=false 的不进主排名
  adapter_flags:
    chembl_lipid_v1:
      enabled: true
      ranking_weight: 1.0
    pubchem_tox_v1:
      enabled: true
      ranking_weight: 1.0
    # EPA CTX only contributes after explicit live enrichment has been
    # normalized and frozen into an evidence snapshot.  It is never read from
    # the network by the ranker.
    epa_ctx_tox_v1:
      enabled: true
      ranking_weight: 1.0
    ot_target_v1:
      enabled: false
      ranking_weight: 0
    nafldkb_v1:
      enabled: false
      ranking_weight: 0
    dili_table_v1:
      enabled: false
      ranking_weight: 0
  # EPA CTX/ToxCast staged integration:
  # 0=disabled, 1=report/audit only, 2=limited toxicity risk scoring.
  # Stage 2: exact identity or shared standardized SMILES may score only when
  # nhit>0 and cytotoxLowerUm ≤ cytotox_screening_um. activeMc/activeSc alone
  # stay bioactivity annotations. CAS-only identity uncertainty is CSV/PDF
  # audit only and does not cancel eligibility.
  epa_ctx:
    enabled: true
    integration_stage: 2
    mapping_paths:
      - data/public/processed/epa_ctx/candidate_mapping.jsonl
      - data/public/processed/epa_ctx/bulk_mapping_all_enriched.jsonl
    risk_summary_paths:
      - data/public/processed/epa_ctx/candidate_risk_summary.jsonl
      - data/public/processed/epa_ctx/bulk_bioactivity_summary.jsonl
    assay_qc_paths:
      - data/public/processed/epa_toxcast_tox21/records_endpoint_qc.jsonl
    require_exact_identity_for_stage2: true
    share_risk_across_standardized_smiles: true
    cytotox_screening_um: 10.0
    active_hit_threshold: 0.90
    max_risk_score: 0.40
    risk_confidence: 0.50
    max_assay_rows_per_candidate: 20
  tox_analog_sim_threshold: 0.75
  tox_analog_boost_alpha: 0.25
  deep_query_top_m: 60          # 同轮仅做冻结/local Top-M 复核；不触发 HTTP
  bake_top_m: 120               # 显式 bake 按 provider 有界并发补证并冻结，覆盖 Critic 漂移席位
  http_timeout_sec: 4.0
  circuit_fail_threshold: 5
  chembl_max_activities: 500
  prefer_snapshot: true         # 排名始终优先并仅重放本地快照；Tool live 可按 TTL 刷新查询缓存
  auto_cache_snapshot: false    # Facade 排名禁用隐式写；显式 bake 负责规范化后写 snapshot
  local_tables:
    enabled: false              # 主路径冻结：NAFLDkb/DILIrank 默认不进主排名
    dili_csv: data/reference/dilirank.csv
    nafld_csv: data/reference/nafldkb.csv
    dili_sim_threshold: 0.70
    nafld_sim_threshold: 0.78
    neighbor: true
  # Wave-1 public assay-grain QC tables (InChIKey exact match).
  # Sparse tables must not bias Top ranking: PubChem Active / BindingDB stay
  # annotation or mechanism_support (score=0). Only ChEMBL phenotype may score.
  # ToxCast assay-grain is skipped here; EPA staged CTX owns risk scoring.
  public_assay_grain:
    enabled: true
    allow_chembl_phenotype_scores: true
    allow_pubchem_bioassay_scores: false
    allow_bindingdb_scores: false
    qc_paths:
      - data/public/processed/chembl_bioactivity/records_endpoint_qc.jsonl
      - data/public/processed/pubchem_bioassay/records_endpoint_qc.jsonl
      - data/public/processed/bindingdb/records_endpoint_qc.jsonl
      - data/public/processed/epa_toxcast_tox21/records_endpoint_qc.jsonl
  # DILIrank exact-identity gate (never raises safety / ranking_weight).
  # Most-DILI exact → hard_exclude; Less/Ambiguous/No → PDF/CSV annotate only.
  dilirank_exact_gate:
    enabled: true
    hard_exclude_most: true
    identity_paths:
      - data/reference/dilirank_identity_mapped.jsonl
      - data/reference/dilirank.csv
  # Shortlist evidence loop: deep_query covers primary+reserve drift seats.
  # ChEMBL/PubChem live adapters 仅由显式 Tool/bake Gateway 调用；screen 不隐式联网。
  require_shortlist_query_statuses: true

diversity:
  method: similarity_mmr
  # 默认每骨架 1 席，兼顾效力与新颖性，避免同核刷榜
  max_per_scaffold: 1
  redundancy_lambda: 0.05
  # 假设通路席位上限（Critic 选榜；不足时放宽回填）
  max_per_pathway: 3
  max_pairwise_tanimoto: 0.60
  similarity_cluster_threshold: 0.50
  max_per_similarity_cluster: 2
  mmr_lambda: 0.85

novelty:
  method: morgan_tanimoto_distance
  reference_version: goldset_relevant_lipid_v1
  fingerprint_radius: 2
  fingerprint_bits: 2048
  unknown_score: 0.50

robustness:
  # 诊断审计，不改主榜；默认关闭以降低筛选墙钟。需要稳健性表时显式 enabled: true。
  enabled: false
  weight_delta: 0.05
  gate_delta: 0.03

feature_cache:
  enabled: true
  directory: .molmind_cache/features
  schema_version: ingest-features-v1

ml:
  enabled: true  # 无 manifest 模型则自动跳过

llm:
  # 机制 PDF 默认用「准确模板」（mechanism_pdf: false），避免 LLM 自由发挥导致不实阈值/证据误用。
  # Critic 改榜默认关闭。Web「LLM+人工复核」见 nomination_review。DeepSeek Key 仍嵌入；开启 mechanism_pdf 也不会改排名。
  enabled: true
  mechanism_pdf: false
  nomination_review: true
  critic_enabled: false
  critic_affects_ranking: false
  temperature: 0
  provider: openai_compatible
  model: deepseek-v4-pro
  # Reflection Gate（purpose=agent_reflection）快模型；主路径勿改用此字段。
  reflection_model: deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
  max_tokens: 4096
  timeout_sec: 120
  use_cache: true
  cache_dir: data/llm_cache
  reflection_timeout_sec: 6
  reflection_max_tokens: 512
  reflection_use_cache: false

critic:
  fp_sim_threshold: 0.75
  fp_tox_soft: 0.45
  known_positive_sim: 0.98      # ≥ 视为库内对照药本身，移出 Top10
  near_positive_sim: 0.60       # ≥ 下调新颖性（收紧 me-too）
  near_positive_soft_drop: 0.65 # ≥ 软踢出 Top（覆盖 Berberine≈0.65–0.70 近邻）
  # 分阳性更严：他汀/双胍近邻（如 Simvastatin sim≈0.49）直接软踢
  near_positive_soft_drop_named:
    Simvastatin: 0.45
    Lovastatin: 0.45
    Metformin: 0.55
  min_novelty_top: 0.28         # 过低新颖性不利于效果×新颖性
  min_mw_top: 180               # 踢掉烟酸等碎片/已知过小分子
  max_family:
    berberine: 1                # 原小檗碱家族最多 1 席
    statin_like: 1
    biguanide: 1

quality_gates:
  min_std_tox: 0.0  # 仅保留旧配置兼容；风险方差不再作为科学性能 PASS/FAIL
  max_goldset_fp_in_top10: 0
  min_scaffold_diversity_top10: 6
  min_parse_success_rate: 0.95
  max_missing_inchikey_rate: 0.05
  min_model_coverage_warning: 0.20

sla:
  full_library_cpu_minutes: 30
